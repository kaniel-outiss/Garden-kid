name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer www
        run: mkdir -p www && cp garden-kids.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Permissions vibration + micro (messages vocaux)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml && grep -n "VIBRATE\|RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - name: Clé de signature fixe (mises à jour sans désinstaller)
        env:
          GK_KEYSTORE: ${{ secrets.GK_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$GK_KEYSTORE" ]; then echo "$GK_KEYSTORE" | base64 -d > android/app/gk.keystore; else cp keys/garden-kids.keystore android/app/gk.keystore; fi
          printf '\nandroid {\n  signingConfigs { gk { storeFile file("gk.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }\n  buildTypes { debug { signingConfig signingConfigs.gk } }\n}\n' >> android/app/build.gradle
      - name: Numéro de version croissant
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk garden-kids.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garden-kids.apk
          path: garden-kids.apk
      - name: Publier en Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Garden Kids build ${{ github.run_number }}
          files: garden-kids.apk
